# Boba refuses its step on a runner it did not boot.
name: Boba on a hosted runner
on:
  workflow_dispatch: {}
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/boba
      - uses: ./.github/actions/boba
        with:
          api-url: ${{ vars.BOBA_API_URL }}
